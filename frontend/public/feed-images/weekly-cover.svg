<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140c24" />
      <stop offset="52%" stop-color="#0b0914" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <radialGradient id="glow1" cx="76%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#6d28d9" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chartLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#glow1)" />
  <rect width="1200" height="675" fill="url(#glow2)" />

  <!-- Subtiles Raster -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Taktik-/Spielfeld-Geometrie rechts -->
  <g stroke="#a855f7" stroke-opacity="0.16" fill="none" stroke-width="2">
    <circle cx="940" cy="240" r="145" />
    <circle cx="940" cy="240" r="72" stroke-opacity="0.12" />
    <line x1="720" y1="240" x2="1160" y2="240" stroke-opacity="0.1" />
  </g>

  <!-- Aufwaerts-Trendkurve -->
  <path d="M 80 430 C 210 410, 290 350, 410 365 C 530 380, 620 270, 760 250 C 890 232, 980 155, 1120 120 L 1120 520 L 80 520 Z" fill="url(#chartFill)" />
  <path d="M 80 430 C 210 410, 290 350, 410 365 C 530 380, 620 270, 760 250 C 890 232, 980 155, 1120 120" fill="none" stroke="url(#chartLine)" stroke-width="5" stroke-linecap="round" />

  <!-- Datenpunkte -->
  <g>
    <circle cx="410" cy="365" r="7" fill="#a855f7" />
    <circle cx="760" cy="250" r="8" fill="#c084fc" />
    <circle cx="1120" cy="120" r="10" fill="#e879f9" />
    <circle cx="1120" cy="120" r="22" fill="#e879f9" fill-opacity="0.18" />
  </g>

  <!-- Form-Balken (S-S-U-S-S) oben rechts -->
  <g transform="translate(835, 62)">
    <rect x="0" y="0" width="44" height="28" rx="8" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-opacity="0.55" />
    <text x="22" y="19" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">S</text>

    <rect x="54" y="0" width="44" height="28" rx="8" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-opacity="0.55" />
    <text x="76" y="19" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">S</text>

    <rect x="108" y="0" width="44" height="28" rx="8" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-opacity="0.55" />
    <text x="130" y="19" text-anchor="middle" fill="#fcd34d" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">U</text>

    <rect x="162" y="0" width="44" height="28" rx="8" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-opacity="0.55" />
    <text x="184" y="19" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">S</text>

    <rect x="216" y="0" width="44" height="28" rx="8" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-opacity="0.6" />
    <text x="238" y="19" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">W</text>
  </g>

  <!-- Subtiles Editorial-Wasserzeichen -->
  <text x="72" y="185" fill="#ffffff" fill-opacity="0.06" font-family="system-ui, -apple-system, sans-serif" font-size="112" font-weight="900" letter-spacing="8">WEEKLY</text>
</svg>
