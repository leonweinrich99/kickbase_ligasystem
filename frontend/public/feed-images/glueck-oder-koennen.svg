<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#170d0c" />
      <stop offset="50%" stop-color="#0b0d12" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    <radialGradient id="glowCoral" cx="22%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#ff5c3e" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#ff5c3e" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="78%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="regLine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5c3e" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="skillArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bandFill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5c3e" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.10" />
    </linearGradient>
  </defs>

  <!-- Hintergrund & Atmosphaere -->
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#glowCoral)" />
  <rect width="1200" height="675" fill="url(#glowEmerald)" />

  <!-- Analytisches Raster -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="112" x2="1200" y2="112" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="337" x2="1200" y2="337" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="562" x2="1200" y2="562" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Subtile Spielfeld-/Mittelkreis-Geometrie -->
  <g stroke="#ffffff" stroke-opacity="0.05" fill="none" stroke-width="2">
    <circle cx="885" cy="315" r="195" />
    <circle cx="885" cy="315" r="95" />
    <line x1="600" y1="0" x2="600" y2="675" stroke-dasharray="6 8" />
  </g>

  <!-- Konfidenzband um die xP = Echt Regressionsdiagonale -->
  <polygon points="120,565 120,470 1090,82 1090,192" fill="url(#bandFill)" />

  <!-- Regressionsdiagonale (xP = Echte Punkte) -->
  <line x1="120" y1="518" x2="1090" y2="136" stroke="url(#regLine)" stroke-width="4" stroke-linecap="round" />
  <line x1="120" y1="518" x2="1090" y2="136" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="8 8" />

  <!-- Abstands-Projektionen (Residuen) fuer markante Manager -->
  <g stroke-width="2" stroke-dasharray="4 4" opacity="0.65">
    <!-- Overperformer (gruen, ueber der Linie) -->
    <line x1="620" y1="184" x2="620" y2="321" stroke="#10b981" />
    <line x1="845" y1="138" x2="845" y2="233" stroke="#10b981" />
    <line x1="765" y1="196" x2="765" y2="264" stroke="#10b981" />
    <line x1="655" y1="242" x2="655" y2="307" stroke="#10b981" />
    <!-- Underperformer (koralle, unter der Linie) -->
    <line x1="870" y1="312" x2="870" y2="223" stroke="#ff5c3e" />
    <line x1="490" y1="486" x2="490" y2="372" stroke="#ff5c3e" />
    <line x1="370" y1="538" x2="370" y2="419" stroke="#ff5c3e" />
    <line x1="670" y1="378" x2="670" y2="301" stroke="#ff5c3e" />
