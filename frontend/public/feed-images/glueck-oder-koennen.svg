    <circle cx="732" cy="280" r="6" fill="#e2e8f0" fill-opacity="0.82" />
    <circle cx="658" cy="292" r="5.5" fill="#cbd5e1" fill-opacity="0.8" />
    <circle cx="240" cy="462" r="5.5" fill="#cbd5e1" fill-opacity="0.72" />
  </g>

  <!-- Underperformer (Koralle) -->
  <g>
    <circle cx="870" cy="312" r="16" fill="#ff5c3e" fill-opacity="0.20" />
    <circle cx="870" cy="312" r="8" fill="#ff5c3e" stroke="#fff1f2" stroke-width="2" />

    <circle cx="725" cy="336" r="6.5" fill="#ff5c3e" fill-opacity="0.9" />
    <circle cx="670" cy="378" r="7" fill="#ff5c3e" />
    <circle cx="648" cy="340" r="5.5" fill="#fb7185" fill-opacity="0.85" />
    <circle cx="490" cy="486" r="14" fill="#ff5c3e" fill-opacity="0.18" />
    <circle cx="490" cy="486" r="7.5" fill="#ff5c3e" stroke="#fff1f2" stroke-width="1.8" />
    <circle cx="370" cy="538" r="7" fill="#ff5c3e" fill-opacity="0.9" />
