  <!-- Subtiles Editorial-Wasserzeichen oben links -->
  <text x="64" y="158" fill="#ffffff" fill-opacity="0.055" font-family="system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" letter-spacing="6">xP · R²</text>
