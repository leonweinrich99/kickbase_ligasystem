    <circle cx="845" cy="138" r="7.5" fill="#10b981" stroke="#ecfdf5" stroke-width="1.8" />

    <circle cx="765" cy="196" r="12" fill="#10b981" fill-opacity="0.16" />
    <circle cx="765" cy="196" r="6.5" fill="#34d399" />

