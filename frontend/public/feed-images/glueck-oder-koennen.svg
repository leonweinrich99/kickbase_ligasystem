    <circle cx="655" cy="242" r="6" fill="#34d399" />

    <circle cx="475" cy="322" r="6" fill="#34d399" fill-opacity="0.88" />
    <circle cx="820" cy="202" r="6" fill="#34d399" fill-opacity="0.88" />
  </g>

