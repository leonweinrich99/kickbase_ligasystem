    <rect x="0" y="0" width="152" height="58" rx="12" fill="#0f1117" fill-opacity="0.76" stroke="#ff5c3e" stroke-opacity="0.45" />
    <text x="16" y="23" fill="#ff5c3e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">1 SPIELTAG</text>
    <text x="16" y="46" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">17 %</text>
    <text x="74" y="45" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Können</text>

    <rect x="166" y="0" width="160" height="58" rx="12" fill="#0f1117" fill-opacity="0.76" stroke="#10b981" stroke-opacity="0.50" />
    <text x="182" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">10 SPIELTAGE</text>
    <text x="182" y="46" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">73 %</text>
    <text x="241" y="45" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Können</text>
