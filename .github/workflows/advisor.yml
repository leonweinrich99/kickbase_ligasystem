name: Kickbase Trading Advisor

# Kein eigener "schedule:"-Trigger (wie bei update-data.yml): Der Vercel-Cron
# (/api/advisor-cron, siehe frontend/vercel.json) stoesst diesen Workflow
# taeglich per workflow_dispatch an - GitHub deaktiviert rein zeitgesteuerte
# Workflows sonst nach laengerer Repo-Inaktivitaet automatisch.
on:
  workflow_dispatch:

jobs:
  run-advisor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend/advisor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Advisor
        working-directory: ./backend/advisor
        run: python run_advisor.py
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}
          KICKBASE_LEAGUE_1_NAME: ${{ vars.KICKBASE_LEAGUE_1_NAME }}
          KICKBASE_LEAGUE_2_NAME: ${{ vars.KICKBASE_LEAGUE_2_NAME }}
          KICKBASE_LEAGUE_3_NAME: ${{ vars.KICKBASE_LEAGUE_3_NAME }}
          ADVISOR_LEAGUE_START_DATE: ${{ vars.ADVISOR_LEAGUE_START_DATE }}
          ADVISOR_START_BUDGET: ${{ vars.ADVISOR_START_BUDGET }}

      - name: Commit and Push Advisor Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/advisor-data.json
          git commit -m "Automatisches Update: Trading-Advisor-Auswertung [skip ci]" || echo "Keine Änderungen zu commiten"
          git push
