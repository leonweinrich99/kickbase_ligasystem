name: Kickbase Trading Advisor

# Kein eigener "schedule:"-Trigger (wie bei update-data.yml): Der Vercel-Cron
# (/api/advisor-cron, siehe frontend/vercel.json) stoesst diesen Workflow
# taeglich per workflow_dispatch an - GitHub deaktiviert rein zeitgesteuerte
# Workflows sonst nach laengerer Repo-Inaktivitaet automatisch.
on:
  workflow_dispatch:

# Verhindert, dass zwei gleichzeitig gestartete Laeufe (z.B. Doppelklick auf
# den "Trading Advisor aktualisieren"-Button) sich beim Git-Push in die Quere
# kommen: Ein zweiter Lauf wartet, bis der erste fertig ist, statt parallel
# zu pushen und dabei zu scheitern (non-fast-forward).
concurrency:
  group: kickbase-trading-advisor
  cancel-in-progress: false

jobs:
  run-advisor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend/advisor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Advisor
        working-directory: ./backend/advisor
        run: python run_advisor.py
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}
          KICKBASE_EMAIL_2: ${{ secrets.KICKBASE_EMAIL_2 }}
          KICKBASE_PASS_2: ${{ secrets.KICKBASE_PASS_2 }}
          KICKBASE_EMAIL_3: ${{ secrets.KICKBASE_EMAIL_3 }}
          KICKBASE_PASS_3: ${{ secrets.KICKBASE_PASS_3 }}
          KICKBASE_EMAIL_4: ${{ secrets.KICKBASE_EMAIL_4 }}
          KICKBASE_PASS_4: ${{ secrets.KICKBASE_PASS_4 }}
          KICKBASE_LEAGUE_1_NAME: ${{ vars.KICKBASE_LEAGUE_1_NAME }}
          KICKBASE_LEAGUE_2_NAME: ${{ vars.KICKBASE_LEAGUE_2_NAME }}
          KICKBASE_LEAGUE_3_NAME: ${{ vars.KICKBASE_LEAGUE_3_NAME }}
          ADVISOR_LEAGUE_START_DATE: ${{ vars.ADVISOR_LEAGUE_START_DATE }}
          ADVISOR_START_BUDGET: ${{ vars.ADVISOR_START_BUDGET }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Commit and Push Advisor Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/advisor-data.json
          git commit -m "Automatisches Update: Trading-Advisor-Auswertung [skip ci]" || echo "Keine Änderungen zu commiten"
          git pull --rebase origin main
          git push
