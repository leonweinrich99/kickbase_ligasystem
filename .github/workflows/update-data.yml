name: Update Kickbase Data

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Snapshot erstellen'
        required: false
        default: 'false'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Fetch Kickbase Data
        working-directory: ./backend
        run: |
          node scripts/fetch-data.js
          node scripts/fetch-transfers.js
          node scripts/calculate-ratings.js
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}
          KICKBASE_EMAIL_2: ${{ secrets.KICKBASE_EMAIL_2 }}
          KICKBASE_PASS_2: ${{ secrets.KICKBASE_PASS_2 }}
          KICKBASE_EMAIL_3: ${{ secrets.KICKBASE_EMAIL_3 }}
          KICKBASE_PASS_3: ${{ secrets.KICKBASE_PASS_3 }}
          KICKBASE_LEAGUE_1_NAME: ${{ vars.KICKBASE_LEAGUE_1_NAME }}
          KICKBASE_LEAGUE_2_NAME: ${{ vars.KICKBASE_LEAGUE_2_NAME }}
          KICKBASE_LEAGUE_3_NAME: ${{ vars.KICKBASE_LEAGUE_3_NAME }}
          SNAPSHOT: ${{ github.event.inputs.snapshot || 'false' }}

      - name: Fetch Optimal Team
        working-directory: ./backend
        run: |
          DAY=$(date +%u)
          if [ "$DAY" -eq 1 ] || [ "$DAY" -eq 5 ] || [ "$DAY" -eq 6 ] || [ "$DAY" -eq 7 ]; then
            echo "Today is day $DAY. Fetching optimal team..."
            node fetchOptimalTeam.js
          else
            echo "Today is day $DAY. Skipping optimal team fetch (only runs Fri-Mon)."
          fi
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add frontend/public/data.json frontend/public/history/
          git commit -m "Automatisches Update: Kickbase Daten & Historie [skip ci]" || echo "Keine Änderungen zu commiten"
          git pull origin main --rebase -X ours || true
          git push origin main
