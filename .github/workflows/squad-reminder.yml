name: Kader-Erinnerung

# Laeuft ueber GitHub Actions statt Vercel Cron (siehe pokal-reminder.yml fuer
# die Begruendung). Ruft einfach den bestehenden Vercel-Endpoint per HTTP auf.
on:
  schedule:
    - cron: '0 18 * * 4'   # Donnerstag 19:00/20:00 Berlin (früher Kader-Alarm vor dem Wochenende)
    - cron: '30 15 * * 5'  # Freitag 16:30/17:30 Berlin (letzter Check vor 20:30-Anpfiff)
  workflow_dispatch:

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Kader-Erinnerung auslösen
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf "https://www.developtimize.de/api/squad-reminder" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Cache-Control: no-cache" \
            -o response.json
          echo "Antwort:"
          cat response.json
