name: Update Optimal Team

on:
  schedule:
    - cron: '0 21 * * 1,5,6,7' # Läuft nur Fr, Sa, So, Mo um 21:00 UTC (wie vorher)
  workflow_dispatch:

jobs:
  update-team:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Fetch Optimal Team
        working-directory: ./backend
        run: node fetchOptimalTeam.js
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add frontend/public/history/
          git commit -m "Automatisches Update: Optimal Team & Players [skip ci]" || echo "Keine Änderungen zu commiten"
          git pull origin main --rebase -X ours || true
          git push origin main
