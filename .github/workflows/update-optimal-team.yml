name: Update Optimal Team

on:
  schedule:
    - cron: '0 21 * * 0,1,5,6' # Läuft nur Fr, Sa, Mo, So um 21:00 UTC (Sonntag=0)
  workflow_dispatch:

# Gleicher Concurrency-Guard wie in update-data.yml (siehe dortiger Kommentar,
# Issue c94c39b3): verhindert, dass zwei fast gleichzeitig getriggerte Laeufe
# (z.B. Cron + manueller workflow_dispatch) beim "git pull --rebase -X ours"
# im Push-Schritt die komplett neu generierten History-Dateien zeilenweise
# zusammenmischen statt sauber eine Version zu uebernehmen.
concurrency:
  group: update-optimal-team
  cancel-in-progress: true

jobs:
  update-team:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Fetch Optimal Team
        working-directory: ./backend
        run: node fetchOptimalTeam.js
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add frontend/public/history/
          git commit -m "Automatisches Update: Optimal Team [skip ci]" || echo "Keine Änderungen zu commiten"
          git pull origin main --rebase -X ours || true
          git push origin main
