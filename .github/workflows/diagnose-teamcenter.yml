name: Diagnose - teamcenter Endpunkt

# EINMALIGES Diagnose-Werkzeug (Issue 9a0d78ba Follow-up, 31.08.2026) - prueft
# den von der Community dokumentierten, aber unbestaetigten Kickbase-Endpunkt
# GET /leagues/{leagueId}/users/{userId}/teamcenter?dayNumber={n} gegen die
# echte API. Schreibt/committet nichts, nur Diagnose-Ausgabe im Workflow-Log.
# Kann nach erfolgreicher Klaerung wieder entfernt werden.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend/advisor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run teamcenter diagnosis
        working-directory: ./backend/advisor
        run: python diagnose_teamcenter.py
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}
          KICKBASE_LEAGUE_1_NAME: ${{ vars.KICKBASE_LEAGUE_1_NAME }}
