name: Diagnose Live Points (temporaer)

# Einmaliges, manuell ausgeloestes Diagnose-Script (siehe backend/scripts/diagnose-live-points.js)
# - prueft nur per GET, ob/wie sich Live-Punkte des eigenen Kaders waehrend
# eines laufenden Spiels ueber die Kickbase-v4-API abrufen lassen. Schreibt/
# aendert nichts, pusht nichts. Wird nach der Analyse wieder entfernt.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Diagnose
        working-directory: ./backend
        run: node scripts/diagnose-live-points.js
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}
          KICKBASE_EMAIL_2: ${{ secrets.KICKBASE_EMAIL_2 }}
          KICKBASE_PASS_2: ${{ secrets.KICKBASE_PASS_2 }}
          KICKBASE_EMAIL_3: ${{ secrets.KICKBASE_EMAIL_3 }}
          KICKBASE_PASS_3: ${{ secrets.KICKBASE_PASS_3 }}
          KICKBASE_EMAIL_4: ${{ secrets.KICKBASE_EMAIL_4 }}
          KICKBASE_PASS_4: ${{ secrets.KICKBASE_PASS_4 }}
          KICKBASE_LEAGUE_1_NAME: ${{ vars.KICKBASE_LEAGUE_1_NAME }}
          KICKBASE_LEAGUE_2_NAME: ${{ vars.KICKBASE_LEAGUE_2_NAME }}
          KICKBASE_LEAGUE_3_NAME: ${{ vars.KICKBASE_LEAGUE_3_NAME }}
