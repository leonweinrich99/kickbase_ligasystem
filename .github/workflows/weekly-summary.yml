name: Weekly Summary

# Erscheint ausschließlich Montags um 18:30 Uhr (Europe/Berlin).
# Da GitHub-Actions-Crons in UTC laufen, sind beide Slots (16:30 UTC für
# Sommerzeit MESZ/+0200 und 17:30 UTC für Winterzeit MEZ/+0100) eingetragen.
# Der Zeitzonen-Check im ersten Schritt stellt sicher, dass immer nur der
# zur aktuellen deutschen Zeit passende Lauf ausgeführt wird (und die
# Vercel-Cron-Slots auf dem Hobby-Plan unberührt bleiben).
on:
  schedule:
    - cron: '30 16 * * 1' # Montag 18:30 MESZ (Sommerzeit, UTC+2)
    - cron: '30 17 * * 1' # Montag 18:30 MEZ  (Winterzeit, UTC+1)
  workflow_dispatch:

concurrency:
  group: weekly-summary
  cancel-in-progress: false

jobs:
  generate-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prüfe Europe/Berlin Sommer-/Winterzeit
        id: tz_check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manueller Start (workflow_dispatch) – führe aus."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=$(TZ=Europe/Berlin date +%z)
          SCHEDULE="${{ github.event.schedule }}"
          echo "Aktueller Europe/Berlin-Offset: $OFFSET, ausgelöster Cron: $SCHEDULE"

          if [ "$SCHEDULE" = "30 16 * * 1" ] && [ "$OFFSET" = "+0200" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "30 17 * * 1" ] && [ "$OFFSET" = "+0100" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Falscher Sommer-/Winterzeit-Slot – überspringe."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        if: steps.tz_check.outputs.should_run == 'true'
        working-directory: ./backend
        run: npm install

      - name: Frische Spieltags-, Startelf- & Transferdaten für Weekly abrufen
        if: steps.tz_check.outputs.should_run == 'true'
        working-directory: ./backend
        run: |
          node scripts/fetch-data.js || echo "Warning: fetch-data fehlgeschlagen, nutze bestehenden Stand"
          node scripts/fetch-transfers.js || echo "Warning: fetch-transfers fehlgeschlagen, nutze bestehenden Stand"
          node reconstructStartingEleven.js || echo "Warning: reconstructStartingEleven fehlgeschlagen, nutze bestehenden Stand"
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}
          KICKBASE_EMAIL_2: ${{ secrets.KICKBASE_EMAIL_2 }}
          KICKBASE_PASS_2: ${{ secrets.KICKBASE_PASS_2 }}
          KICKBASE_EMAIL_3: ${{ secrets.KICKBASE_EMAIL_3 }}
          KICKBASE_PASS_3: ${{ secrets.KICKBASE_PASS_3 }}
          KICKBASE_EMAIL_4: ${{ secrets.KICKBASE_EMAIL_4 }}
          KICKBASE_PASS_4: ${{ secrets.KICKBASE_PASS_4 }}
          KICKBASE_LEAGUE_1_NAME: ${{ vars.KICKBASE_LEAGUE_1_NAME }}
          KICKBASE_LEAGUE_2_NAME: ${{ vars.KICKBASE_LEAGUE_2_NAME }}
          KICKBASE_LEAGUE_3_NAME: ${{ vars.KICKBASE_LEAGUE_3_NAME }}
          KICKBASE_LEAGUE_POKAL_NAME: ${{ vars.KICKBASE_LEAGUE_POKAL_NAME }}

      - name: Weekly Summary generieren (inkl. Gemini-Redaktion)
        if: steps.tz_check.outputs.should_run == 'true'
        working-directory: ./backend
        run: node scripts/generate-weekly.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}
          KICKBASE_EMAIL_2: ${{ secrets.KICKBASE_EMAIL_2 }}
          KICKBASE_PASS_2: ${{ secrets.KICKBASE_PASS_2 }}
          KICKBASE_EMAIL_3: ${{ secrets.KICKBASE_EMAIL_3 }}
          KICKBASE_PASS_3: ${{ secrets.KICKBASE_PASS_3 }}
          KICKBASE_EMAIL_4: ${{ secrets.KICKBASE_EMAIL_4 }}
          KICKBASE_PASS_4: ${{ secrets.KICKBASE_PASS_4 }}
          KICKBASE_LEAGUE_1_NAME: ${{ vars.KICKBASE_LEAGUE_1_NAME }}
          KICKBASE_LEAGUE_2_NAME: ${{ vars.KICKBASE_LEAGUE_2_NAME }}
          KICKBASE_LEAGUE_3_NAME: ${{ vars.KICKBASE_LEAGUE_3_NAME }}

      - name: Commit und Push Weekly Summary
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Nur weekly-summary.json committen (data.json/history verwaltet update-data.yml exklusiv)
          git checkout -- frontend/public/data.json frontend/public/history/ 2>/dev/null || true
          git clean -fd frontend/public/history/ 2>/dev/null || true
          git add frontend/public/weekly-summary.json
          git commit -m "Weekly Summary: Neue Montags-Ausgabe [skip ci]" || echo "Keine Änderungen zu commiten"
          git pull origin main --rebase -X ours || true
          git push origin main
