name: Update Pokal-Ergebnisse

# Wertet die Pokal-Duelle aus, sobald ein Pokal-Spieltag final abgerechnet ist.
# Das eigentliche Timing steuert das Skript SELBST anhand der in pokal-data.json
# hinterlegten Rundendaten (meta.roundSchedule) - nicht anhand von Kickbases
# eigenem, mehrdeutigem "aktueller Spieltag"-Zähler. Deshalb läuft dieser
# Workflow bewusst TÄGLICH: vor jeder Pokal-Runde sichert er laufend die
# Vergleichsbasis (Punktestand VOR dem Spieltag), nach Ablauf der Runde
# (Rundendatum + 3 Tage Puffer für den Fr-Mo-Spieltag) wertet er sie aus.
# Details siehe Kommentar in backend/scripts/fetch-pokal-arena.js.
on:
  schedule:
    - cron: '0 6 * * *' # täglich 06:00 UTC
  workflow_dispatch:

jobs:
  update-pokal-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Fetch Pokal-Ergebnisse
        working-directory: ./backend
        run: node scripts/fetch-pokal-arena.js
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASS: ${{ secrets.KICKBASE_PASS }}
          KICKBASE_EMAIL_2: ${{ secrets.KICKBASE_EMAIL_2 }}
          KICKBASE_PASS_2: ${{ secrets.KICKBASE_PASS_2 }}
          KICKBASE_EMAIL_3: ${{ secrets.KICKBASE_EMAIL_3 }}
          KICKBASE_PASS_3: ${{ secrets.KICKBASE_PASS_3 }}
          KICKBASE_EMAIL_4: ${{ secrets.KICKBASE_EMAIL_4 }}
          KICKBASE_PASS_4: ${{ secrets.KICKBASE_PASS_4 }}
          KICKBASE_LEAGUE_POKAL_NAME: ${{ vars.KICKBASE_LEAGUE_POKAL_NAME }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add frontend/public/pokal-data.json frontend/public/history/_pokal_points_snapshot.json
          git commit -m "Automatisches Update: Pokal-Ergebnisse [skip ci]" || echo "Keine Änderungen zu commiten"
          git pull origin main --rebase -X ours || true
          git push origin main
