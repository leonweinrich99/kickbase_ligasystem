name: Diagnose Pokal-Manager

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: ./backend/advisor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - working-directory: ./backend/advisor
        run: python _diag_pokal.py
        env:
          KICKBASE_EMAIL_4: ${{ secrets.KICKBASE_EMAIL_4 }}
          KICKBASE_PASS_4: ${{ secrets.KICKBASE_PASS_4 }}
